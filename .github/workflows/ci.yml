name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check --output-format=github src tests
      - name: Ruff format
        run: python -m ruff format --check src tests
      - name: Test
        run: python -m pytest
      - name: Shared-model smoke test
        run: nanodesign-v0 smoke --config configs/v0.yaml
