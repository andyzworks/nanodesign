name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check --output-format=github src tests
      - name: Ruff format
        run: python -m ruff format --check src tests
      - name: Test
        run: |
          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "-m", "pytest"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
          )
          print(result.stdout, end="")
          if result.returncode:
              message = result.stdout.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=pytest collection or test failure::{message[-50000:]}")
          raise SystemExit(result.returncode)
          PY
      - name: Shared-model smoke test
        run: nanodesign-v0 smoke --config configs/v0.yaml
