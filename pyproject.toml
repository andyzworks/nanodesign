[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanodesign"
version = "0.0.1"
description = "Strict infrastructure for the NanoDesign v0 three-task molecular design benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
data = [
  "gemmi==0.6.7",
  "pandas>=2.2",
  "requests>=2.32",
  "scipy>=1.12",
]
evaluation = [
  "DockQ==2.1.3",
  "gemmi==0.6.7",
]
model = [
  "rc-foundry[rfd3na] @ git+https://github.com/RosettaCommons/foundry.git@aad357b776e3c0d6b973080f8f8c4bcf3ed21e40",
]
dev = [
  "pytest>=8.0",
  "ruff==0.16.5",
]

[project.scripts]
nanodesign-v0 = "nanodesign.v0.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["nanodesign"]
